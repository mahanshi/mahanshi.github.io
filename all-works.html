<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>All Works — Mahan Shishehchi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/style.css">

  <style>
    .catalogue-list {
      list-style: none;
      padding: 0;
      margin: 3rem 0 0;
      border-top: 1px solid var(--line, rgba(255,255,255,.15));
    }

    .catalogue-item {
      display: grid;
      grid-template-columns: 42px 1fr 70px;
      gap: 18px;
      align-items: center;
      padding: 25px 0;
      border-bottom: 1px solid var(--line, rgba(255,255,255,.15));
    }

    .catalogue-number {
      font-size: 11px;
      letter-spacing: .08em;
      opacity: .45;
    }

    .catalogue-title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(23px, 3vw, 30px);
      line-height: 1.15;
      margin: 0;
      font-weight: 400;
    }

    .catalogue-subtitle {
      font-size: 13px;
      line-height: 1.6;
      opacity: .65;
      margin: 7px 0 0;
    }

    .catalogue-instrumentation {
      font-size: 12px;
      opacity: .8;
      margin: 5px 0 0;
      line-height: 1.5;
    }

    .catalogue-year {
      font-size: 12px;
      text-align: right;
      opacity: .65;
      letter-spacing: .04em;
    }

    @media (max-width: 600px) {
      .catalogue-item {
        grid-template-columns: 28px 1fr 42px;
        gap: 10px;
        padding: 21px 0;
      }

      .catalogue-title {
        font-size: 24px;
      }

      .catalogue-subtitle,
      .catalogue-instrumentation {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <div class="paint-layer"></div>

  <header class="site-header">
    <a class="wordmark" href="index.html">
      MAHAN SHISHEHCHI<span>COMPOSER</span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a class="active" href="all-works.html">All works</a>
      <a href="cv.html">CV</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="detail-main">
    <a class="back-link" href="index.html">← Home</a>

    <p class="eyebrow">CATALOGUE</p>
    <h1 class="detail-title">All works</h1>
    <p class="detail-subtitle">Compositions for different forces and media</p>

    <ol id="all-work-list" class="catalogue-list"></ol>
  </main>

  <footer>
    <span>© <span id="year"></span> Mahan Shishehchi</span>
    <a href="cv.html">CV ↗</a>
    <a href="index.html">Home</a>
  </footer>

  <script src="assets/works.js"></script>

  <script>
    const list = document.getElementById('all-work-list');

    list.innerHTML = allWorks.map((work, index) => `
      <li class="catalogue-item">
        <span class="catalogue-number">
          ${String(index + 1).padStart(2, '0')}
        </span>

        <div>
          <h2 class="catalogue-title">${work.title}</h2>
          <p class="catalogue-subtitle">(${work.subtitle})</p>
          <p class="catalogue-instrumentation">${work.instrumentation}</p>
        </div>

        <span class="catalogue-year">${work.year}</span>
      </li>
    `).join('');

    document.getElementById('year').textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
